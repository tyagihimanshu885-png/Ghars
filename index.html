<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trump Premium - Clockwise 15 Rounds Fixed</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',system-ui}
body{background:#0e5a2f;min-height:100vh;overflow:hidden;user-select:none}
.felt{position:fixed;inset:0;background:#0e5a2f;display:flex;align-items:center;justify-content:center}
.table{width:100vw;height:100vh;max-width:520px;position:relative;background:radial-gradient(ellipse at center,#1a7a44 0%,#0e5a2f 70%);overflow:hidden}
.player{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:5}
.p-top{top:10px;left:50%;transform:translateX(-50%)}
.p-left{left:6px;top:36%;transform:translateY(-50%)}
.p-right{right:6px;top:36%;transform:translateY(-50%)}
.p-bottom{bottom:0;left:50%;transform:translateX(-50%);width:100%;z-index:20}
.avatar{width:42px;height:42px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;border:3px solid #ffca28;box-shadow:0 2px 6px rgba(0,0,0,.4);font-size:15px}
.avatar.active{border-color:#00e676;box-shadow:0 0 12px #00e676;background:#e8f5e9}
.nameTag{background:rgba(0,0,0,.85);color:#fff;padding:2px 7px;border-radius:8px;font-size:11px;text-align:center;line-height:1.1;min-width:42px}
.nameTag b{color:#ffca28;font-size:12px}
.cards{display:flex;justify-content:center}
.card{width:46px;height:66px;background:#fff;border-radius:6px;border:1px solid #777;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .25s;margin-left:-6px;position:relative}
.card:first-child{margin-left:0}
.card.red{color:#d32f2f}.card.black{color:#111}
.card.back{background:repeating-linear-gradient(45deg,#1a3a5a,#1a3a5a 4px,#2a5a8a 4px,#2a5a8a 8px);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.card.disabled{opacity:0.25;pointer-events:none;filter:grayscale(1)}
.p-top .cards{margin-top:6px}.p-top .card{width:28px;height:38px;margin-left:-14px;border-width:1px;border-radius:3px}
.p-left .cards,.p-right .cards{flex-direction:column;margin-top:6px}.p-left .card,.p-right .card{width:38px;height:28px;margin-left:0;margin-top:-18px;transform:none;border-radius:3px}
.p-left .card:first-child,.p-right .card:first-child{margin-top:0}
.p-bottom .cards{width:98vw;max-width:520px;padding:0 4px;gap:0;justify-content:center}
.p-bottom .card{width:8.2vw;max-width:46px;min-width:32px;height:72px;margin-left:-3px;border-radius:6px 6px 0 0;transition:transform .3s ease;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px 1px}
.p-bottom .card .rank{font-size:11px;line-height:1}
.p-bottom .card .suit{font-size:26px;line-height:1;margin:2px 0}
.p-bottom .card:hover{transform:translateY(-16px);z-index:30}
.centerWrap{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:320px;height:320px;z-index:6;display:flex;align-items:center;justify-content:center}
.trumpCenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:120px;opacity:0.28;color:#fff;font-weight:900;pointer-events:none;z-index:1;text-shadow:0 0 30px #000,0 0 50px #000}
.trumpCenter.red{color:#ff8a8a;opacity:0.40}
.trumpBadge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#ffca28;color:#000;padding:3px 10px;border-radius:12px;font-weight:800;font-size:12px;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap}
.centerCards{position:relative;width:100%;height:100%;display:block;z-index:2}
.centerCards .card{position:absolute;width:70px;height:94px;margin:0;box-shadow:0 6px 18px rgba(0,0,0,.6);border-radius:8px;border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.centerCards .card .whoLabel{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:#ffca28;font-size:9px;padding:1px 6px;border-radius:10px;white-space:nowrap;font-weight:700;border:1px solid #ffca28}
.centerCards .card.pos-A{bottom:15px;left:50%;z-index:4}
.centerCards .card.pos-B{left:10px;top:50%;z-index:3}
.centerCards .card.pos-C{top:15px;left:50%;z-index:2}
.centerCards .card.pos-D{right:10px;top:50%;z-index:3}
@keyframes throwFromBottom{0%{transform:translate(-50%,250px) scale(0.1);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes throwFromTop{0%{transform:translate(-50%,-250px) scale(0.1);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes throwFromLeft{0%{transform:translate(-250px,-50%) scale(0.1);opacity:0}100%{transform:translate(0,-50%) scale(1);opacity:1}}
@keyframes throwFromRight{0%{transform:translate(250px,-50%) scale(0.1);opacity:0}100%{transform:translate(0,-50%) scale(1);opacity:1}}
.throw-bottom{animation:throwFromBottom .65s cubic-bezier(0.175,0.885,0.32,1.275) forwards}
.throw-top{animation:throwFromTop .65s cubic-bezier(0.175,0.885,0.32,1.275) forwards}
.throw-left{animation:throwFromLeft .65s cubic-bezier(0.175,0.885,0.32,1.275) forwards}
.throw-right{animation:throwFromRight .65s cubic-bezier(0.175,0.885,0.32,1.275) forwards}
@keyframes winToBottom{to{transform:translate(-50%,350px) scale(0);opacity:0}}
@keyframes winToTop{to{transform:translate(-50%,-350px) scale(0);opacity:0}}
@keyframes winToLeft{to{transform:translate(-350px,-50%) scale(0);opacity:0}}
@keyframes winToRight{to{transform:translate(350px,-50%) scale(0);opacity:0}}
.win-to-A{animation:winToBottom .6s ease-in forwards}
.win-to-B{animation:winToLeft .6s ease-in forwards}
.win-to-C{animation:winToTop .6s ease-in forwards}
.win-to-D{animation:winToRight .6s ease-in forwards}
.turnBar{position:absolute;left:2%;right:2%;top:62%;background:#ff9800;color:#000;padding:6px 10px;border-radius:4px;font-weight:700;font-size:12px;z-index:15;text-align:left}
.scoreBoard{position:absolute;right:6px;bottom:80px;background:rgba(255,255,255,.96);border:1px solid #000;border-radius:4px;padding:3px;font-size:9px;z-index:25;min-width:132px}
.scoreBoard table{width:100%;border-collapse:collapse}.scoreBoard td,.scoreBoard th{border:1px solid #555;padding:2px 4px;text-align:center}.scoreBoard th{background:#ddd;font-size:8px}
.ui{position:fixed;left:4px;top:4px;background:rgba(0,0,0,.85);color:#fff;padding:6px 8px;border-radius:8px;font-size:9px;min-width:190px;z-index:100;transition:all .4s}
.ui.hideGame{opacity:0;pointer-events:none;transform:translateY(-30px)}
.btn{padding:6px 10px;border-radius:7px;border:none;font-weight:700;cursor:pointer;margin:2px;font-size:11px}.by{background:#ffca28;color:#000}.bg{background:#2e7d32;color:#fff}.bb{background:#1565c0;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:300}.modalBox{background:#123e33;border-radius:12px;padding:14px;max-width:520px;width:94%;border:2px solid #1f6b55;text-align:center;max-height:92vh;overflow:auto}
.hidden{display:none}.row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.bidbox{padding:4px 7px;background:#0e3a2e;border-radius:6px;margin:2px 0;font-size:11px;display:flex;justify-content:space-between;color:#fff}
.histTable{width:100%;border-collapse:collapse;font-size:9px;margin-top:6px}.histTable th,.histTable td{border:1px solid #444;padding:3px 4px;text-align:center}.histTable th{background:#ffca28;color:#000}
</style>
</head>
<body>
<div class="felt"><div class="table">
<div class="player p-top" id="seat-C"><div class="avatar" id="av-C">C</div><div class="nameTag" id="tag-C">C<br><b>0/4</b></div><div class="cards" id="hand-C"></div></div>
<div class="player p-left" id="seat-B"><div class="avatar" id="av-B">B</div><div class="nameTag" id="tag-B">B<br><b>0/3</b></div><div class="cards" id="hand-B"></div></div>
<div class="player p-right" id="seat-D"><div class="avatar" id="av-D">D</div><div class="nameTag" id="tag-D">D<br><b>0/2</b></div><div class="cards" id="hand-D"></div></div>
<div class="centerWrap"><div id="trumpBadge" class="trumpBadge">TRUMP: ?</div><div id="trumpCenter" class="trumpCenter"></div><div id="centerCards" class="centerCards"></div></div>
<div id="turnBar" class="turnBar hidden">Your turn!</div>
<div class="player p-bottom" id="seat-A"><div class="avatar" id="av-A">A</div><div class="nameTag" id="tag-A">A<br><b>0/4</b></div>
<div class="scoreBoard"><table><tr><th>Player</th><th>Score</th><th>Bagh</th></tr><tr><td id="p0">A</td><td id="sc0">0</td><td id="bg0">0</td></tr><tr><td id="p1">B</td><td id="sc1">0</td><td id="bg1">0</td></tr><tr><td id="p2">C</td><td id="sc2">0</td><td id="bg2">0</td></tr><tr><td id="p3">D</td><td id="sc3">0</td><td id="bg3">0</td></tr></table></div>
<div class="cards" id="hand-A"></div></div>
</div></div>
<div class="ui" id="uiBox"><div><b>Room:</b> <span id="roomIdTxt">-</span> <button class="btn by" onclick="copyRoom()">COPY</button> <button class="btn bb" onclick="shareWA()">WA</button> <button class="btn bg" onclick="showHistory()">HISTORY</button></div><div>Game <b id="gno">1</b>/15 | Dealer <b id="dealer">-</b> | Bidder <b id="bidder">-</b></div><div>Trump: <b id="trump">?</b> | <span id="phase">Lobby</span></div><div id="bids"></div><div id="scores"></div><div id="lobbyInfo"></div></div>
<div id="modal" class="modal"><div class="modalBox"><h3 style="color:#ffca28">🃏 Trump Premium Online</h3><p style="font-size:11px;color:#ffe082;margin:6px 0">Clockwise 15 rounds - 52 unique - no freeze - Dealer B->Trump C->Chaal C</p><input id="myName" placeholder="Tumhara Naam"><div class="row" style="margin-top:8px"><button class="btn by" onclick="createRoom()">ROOM BANAO</button></div><div class="row"><input id="joinId" placeholder="Room ID" style="flex:1"><button class="btn bb" onclick="joinRoom()">JOIN</button></div></div></div>
<div id="bidModal" class="modal hidden"><div class="modalBox"><h3 id="bidTitle">Bid</h3><div id="bidRoundInfo" style="margin:4px 0;font-size:11px;color:#ffe082"></div><div id="bidTrumpInfo" style="margin:6px 0;font-size:13px;font-weight:800;color:#ffca28"></div><div id="bidCards" class="row" style="margin:8px 0"></div><div id="bidBtns"></div><div id="trumpBtns" style="margin-top:8px"></div></div></div>
<div id="historyModal" class="modal hidden"><div class="modalBox"><h3 style="color:#ffca28">📊 Har Round Ka Pura Hisab</h3><div id="historyContent" style="max-height:60vh;overflow:auto"></div><div style="margin-top:10px"><button class="btn bg" onclick="nextRoundStart()">NEXT ROUND START ▶</button> <button class="btn by" onclick="closeHistory()">Band Karo</button></div></div></div>
<script>
let myName="",roomId="",peer=null,conns={},isHost=false,players=[],dealer=0,bidder=1,gameNo=1,scores={},extra={},hands={},bids={},trump="",tricksWon={},center=[],turn=0,trick=1,deck=[],isBotGame=false,gameStarted=false,historyLog=[];
const suits=["♠","♥","♦","♣"],ranks=["A","K","Q","J","10","9","8","7","6","5","4","3","2"],pow={A:14,K:13,Q:12,J:11,"10":10,"9":9,"8":8,"7":7,"6":6,"5":5,"4":4,"3":3,"2":2};
function rnd(n){return Math.floor(Math.random()*n)}
function mkDeck(){
  let d=[]; let seen={};
  for(let s of suits){ for(let r of ranks){ let id=s+"_"+r; if(!seen[id]){ seen[id]=1; d.push({s:s,r:r,p:pow[r],id:id}); } } }
  for(let i=d.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); let t=d[i]; d[i]=d[j]; d[j]=t; }
  return d;
}
function sortBySuit(a,b){let o={'♠':0,'♥':1,'♦':2,'♣':3}; if(o[a.s]!=o[b.s]) return o[a.s]-o[b.s]; return b.p-a.p;}
function createRoom(){myName=document.getElementById('myName').value.trim();if(!myName){alert('Naam likho');return}roomId='TRUMP'+(rnd(9000)+1000);isHost=true;players=[myName];document.getElementById('roomIdTxt').innerText=roomId;document.getElementById('modal').classList.add('hidden');document.getElementById('lobbyInfo').innerHTML='Room <b>'+roomId+'</b><br><button class="btn by" onclick="startBotIfAlone()">Akele (Bots) Khelo</button> <button class="btn bg" onclick="hostStartGame()">START</button>';gameStarted=false;try{peer=new Peer(roomId);peer.on('open',function(){});peer.on('connection',function(c){c.on('open',function(){c.on('data',function(d){handleData(d,c);});conns[c.peer]=c;});});peer.on('error',function(){if(!gameStarted)startBotIfAlone();});setTimeout(function(){if(!gameStarted&&Object.keys(conns).length===0)startBotIfAlone();},1500);}catch(e){setTimeout(function(){if(!gameStarted)startBotIfAlone();},300);}}
function startBotIfAlone(){if(gameStarted)return;gameStarted=true;document.getElementById('modal').classList.add('hidden');isBotGame=true;if(players.length<2)players=[myName,'B','C','D'];hostStartGame();}
function joinRoom(){myName=document.getElementById('myName').value.trim();let jid=document.getElementById('joinId').value.trim().toUpperCase();if(!myName||!jid){alert('Naam aur Room ID');return}roomId=jid;isHost=false;document.getElementById('roomIdTxt').innerText=roomId;document.getElementById('modal').classList.add('hidden');try{peer=new Peer();peer.on('open',function(){let conn=peer.connect(roomId);conn.on('open',function(){conns[roomId]=conn;conn.on('data',function(d){handleData(d);});conn.send({type:'join',name:myName});});});}catch(e){startBotIfAlone();}}
function handleData(data,connFrom){
  if(data.type=='join'&&isHost){if(players.indexOf(data.name)===-1)players.push(data.name);if(connFrom)conns[data.name]=connFrom;broadcast({type:'lobby',players:players});updateUI();}
  if(data.type=='lobby'){players=data.players;updateUI();}
  if(data.type=='deal'){hands=data.hands;dealer=data.dealer;bidder=data.bidder;gameNo=data.gameNo;trump=data.trump||"";bids=data.bids||{};scores=data.scores;extra=data.extra;deck=data.deck||[];updateUI();renderAll();}
  if(data.type=='firstBid'){trump=data.trump;bids=data.bids;updateUI();if(isHost)setTimeout(dealRestHost,800);}
  if(data.type=='bid'){bids=data.bids;updateUI();if(isHost)checkBidsAndContinue();}
  if(data.type=='play'){center=data.center;turn=data.turn;tricksWon=data.tricksWon;renderAll();updateUI();}
  if(data.type=='trickEnd'){tricksWon=data.tricksWon;center=[];turn=data.turn;trick=data.trick;updateUI();renderAll();if(isBotGame&&players[turn]!=myName)setTimeout(botPlay,800);}
  if(data.type=='gameOver'){scores=data.scores;extra=data.extra;historyLog=data.historyLog||historyLog;updateUI();gameNo=data.nextGame;if(gameNo>15){showFinal();}else{showHistoryAuto();}}
  if(data.type=='nextRound'){gameNo=data.gameNo;closeHistory();if(isHost)hostStartGame();}
}
function broadcast(obj){let keys=Object.keys(conns);for(let i=0;i<keys.length;i++){try{conns[keys[i]].send(obj)}catch(e){}}}
function hostStartGame(){
  gameStarted=true;
  if(players.length<2)players=[myName,'B','C','D'];
  if(Object.keys(scores).length==0){for(let i=0;i<players.length;i++){scores[players[i]]=0;extra[players[i]]=0;}}
  dealer=(gameNo-1)%players.length;
  bidder=(dealer+1)%players.length;
  bids={};trump="";tricksWon={};for(let i=0;i<players.length;i++)tricksWon[players[i]]=0;
  center=[];trick=1;turn=bidder;
  let fullDeck=mkDeck();
  hands={};
  for(let i=0;i<players.length;i++){hands[players[i]]=fullDeck.splice(0,5);}
  deck=fullDeck;
  document.getElementById('uiBox').classList.add('hideGame');
  broadcast({type:'deal',hands:hands,dealer:dealer,bidder:bidder,gameNo:gameNo,trump:trump,bids:bids,scores:scores,extra:extra,deck:deck});
  updateUI();renderAll();
  document.getElementById('phase').innerText='Game '+gameNo+' - Dealer: '+players[dealer]+' - Trump: '+players[bidder]+' - Chaal: '+players[bidder];
  if(isBotGame){
    setTimeout(botFirstBid,1000);
  }else{
    if(players[bidder]==myName)showBidModal(players[bidder],5,true);
  }
}
function botFirstBid(){
  let who=players[bidder];
  let hb=hands[who]||[];
  let cnt={};for(let i=0;i<hb.length;i++){let c=hb[i];cnt[c.s]=(cnt[c.s]||0)+1;}
  let best='♠';let max=0;for(let k in cnt){if(cnt[k]>max){max=cnt[k];best=k;}}
  trump=best;
  let bid=Math.max(2,Math.min(7,max+rnd(2)+1));
  bids[who]=bid;
  broadcast({type:'firstBid',trump:trump,bids:bids});
  updateUI();
  setTimeout(dealRestHost,800);
}
function dealRestHost(){
  for(let i=0;i<players.length;i++){
    let p=players[i];
    if(hands[p] && hands[p].length===5){
      let eight=deck.splice(0,8);
      hands[p]=hands[p].concat(eight);
    }
  }
  let allIds=[];for(let i=0;i<players.length;i++){let p=players[i]; for(let j=0;j<hands[p].length;j++) allIds.push(hands[p][j].id);}
  let seen={}; let hasDup=false;
  for(let i=0;i<allIds.length;i++){ if(seen[allIds[i]]) hasDup=true; seen[allIds[i]]=1; }
  if(hasDup || allIds.length!==52){
    let full=mkDeck();
    hands={};
    for(let i=0;i<players.length;i++){hands[players[i]]=full.splice(0,13);}
  }
  deck=[];
  broadcast({type:'deal',hands:hands,dealer:dealer,bidder:bidder,gameNo:gameNo,trump:trump,bids:bids,scores:scores,extra:extra,deck:[]});
  updateUI();renderAll();
  let next=(bidder+1)%players.length;
  checkBidsAndContinue(next);
}
function checkBidsAndContinue(startIdx){
  if(startIdx===undefined) startIdx=(bidder+1)%players.length;
  if(Object.keys(bids).length>=players.length){ startTricksHost(); return; }
  let idx=startIdx;
  let attempts=0;
  while(attempts<10){
    if(Object.keys(bids).length>=players.length) break;
    let who=players[idx];
    if(bids[who]==null){
      if(who==myName){
        showBidModal(who,13,false);
        return;
      }else{
        if(isBotGame){
          let hb=hands[who]||[];
          let high=0;for(let i=0;i<hb.length;i++){if(hb[i].r=='A'||hb[i].r=='K'||hb[i].r=='Q') high++;}
          let tc=0;for(let i=0;i<hb.length;i++){if(hb[i].s==trump) tc++;}
          let b=Math.max(1,Math.min(8,Math.floor(high/1.5)+Math.floor(tc/2)+rnd(2)));
          bids[who]=b;
          broadcast({type:'bid',bids:bids});
          updateUI();
        }
      }
    }
    idx=(idx+1)%players.length;
    if(idx==bidder) idx=(idx+1)%players.length;
    attempts++;
  }
  if(Object.keys(bids).length>=players.length){ startTricksHost(); }
}
function botBid(idx){ checkBidsAndContinue(idx); }
function checkBids(){ checkBidsAndContinue((bidder+1)%players.length); }
function startTricksHost(){
  turn=bidder;
  trick=1;center=[];tricksWon={};for(let i=0;i<players.length;i++)tricksWon[players[i]]=0;
  document.getElementById('uiBox').classList.add('hideGame');
  broadcast({type:'play',center:center,turn:turn,tricksWon:tricksWon});
  updateUI();renderAll();
  if(isBotGame&&players[turn]!=myName)setTimeout(botPlay,800);
}
function showBidModal(who,cnt,isFirst){
  document.getElementById('bidModal').classList.remove('hidden');
  let sortedHand=[]; let hh=hands[who]||[]; for(let i=0;i<hh.length;i++) sortedHand.push(hh[i]); sortedHand.sort(sortBySuit);
  let roundInfo='Round '+gameNo+' | Dealer: '+players[dealer]+' (baantega) | Trump: '+players[bidder]+' bolega | Chaal: '+players[bidder]+' se | Clockwise';
  let el=document.getElementById('bidRoundInfo'); if(el) el.innerText=roundInfo;
  let trumpHtml='';
  if(trump){
    let c=0;for(let i=0;i<sortedHand.length;i++) if(sortedHand[i].s==trump) c++;
    trumpHtml='Trump: <b style="background:#ffca28;color:#000;padding:4px 12px;border-radius:10px;font-size:16px;">'+trump+'</b> me tumhari '+c+' patte hai - Chaal '+players[bidder]+' se shuru hogi';
  }else{
    trumpHtml='Apni 5 patte dekh ke Trump + Bid bolo - Dealer '+players[dealer]+' hai, chaal tumse shuru hogi';
  }
  document.getElementById('bidTrumpInfo').innerHTML=trumpHtml;
  document.getElementById('bidTitle').innerText=who+' - '+cnt+' patte - '+(isFirst?'Trump + Bid':'Bid')+' (Game '+gameNo+'/15)';
  let cardsHtml=''; for(let i=0;i<Math.min(cnt,sortedHand.length);i++){let c=sortedHand[i]; cardsHtml+='<div class="card '+(c.s=='♥'||c.s=='♦'?'red':'black')+'"><div class="rank">'+c.r+'</div><div class="suit" style="font-size:26px">'+c.s+'</div></div>';}
  document.getElementById('bidCards').innerHTML=cardsHtml;
  let opts=''; for(let i=1;i<=(isFirst?7:10);i++){opts+='<option value="'+i+'" '+(i==4?'selected':'')+'>'+i+'</option>';}
  document.getElementById('bidBtns').innerHTML='Bid: <select id="bidSel">'+opts+'</select> <button class="btn by" onclick="confirmBid('+isFirst+')">Lock</button>';
  if(isFirst)document.getElementById('trumpBtns').innerHTML='Trump: <button class="btn bg" onclick="setTmp(\'♠\')">♠</button><button class="btn bg" onclick="setTmp(\'♥\')">♥</button><button class="btn bg" onclick="setTmp(\'♦\')">♦</button><button class="btn bg" onclick="setTmp(\'♣\')">♣</button> <b id="tmpShow">?</b>';
  else document.getElementById('trumpBtns').innerHTML='';
}
let tmpT="";function setTmp(s){tmpT=s;document.getElementById('tmpShow').innerText=s}
function confirmBid(isFirst){
  let b=parseInt(document.getElementById('bidSel').value);
  if(isFirst){if(!tmpT){alert('Trump choose karo');return}trump=tmpT;}
  bids[myName]=b;
  document.getElementById('bidModal').classList.add('hidden');
  tmpT="";
  updateUI();
  if(isFirst){
    broadcast({type:'firstBid',trump:trump,bids:bids});
    setTimeout(dealRestHost,600);
  }else{
    broadcast({type:'bid',bids:bids});
    let nextIdx=(players.indexOf(myName)+1)%players.length;
    if(nextIdx==bidder) nextIdx=(nextIdx+1)%players.length;
    setTimeout(function(){checkBidsAndContinue(nextIdx);},400);
  }
}
function updateUI(){document.getElementById('gno').innerText=gameNo;document.getElementById('dealer').innerText=players[dealer]||'-';document.getElementById('bidder').innerText=players[bidder]||'-';document.getElementById('trump').innerText=trump||'?';let tc=document.getElementById('trumpCenter');if(tc){tc.innerText=trump||'';tc.className='trumpCenter '+(trump=='♥'||trump=='♦'?'red':'');}let tb=document.getElementById('trumpBadge');if(tb){tb.innerText=trump?'TRUMP: '+trump:'TRUMP: ?';tb.style.display=trump?'block':'none';}let bar=document.getElementById('turnBar');if(players[turn]==myName){bar.classList.remove('hidden');bar.innerText='Your turn! - Trump: '+(trump||'?')+' - Lead: '+(center.length>0?center[0].s:'')+' - Round '+gameNo;}else{bar.classList.add('hidden');}let bhtml='';for(let i=0;i<players.length;i++){let p=players[i]; bhtml+=p+':Bid '+(bids[p]!=null?bids[p]:'-')+' ';}document.getElementById('bids').innerHTML=bhtml;let shtml='';for(let i=0;i<players.length;i++){let p=players[i]; shtml+=p+':'+(scores[p]||0)+'('+(extra[p]||0)+') ';}document.getElementById('scores').innerHTML=shtml;for(let i=0;i<4;i++){let id=["A","B","C","D"][i];let p=players[i];if(!p)continue;let tag=document.getElementById('tag-'+id);if(tag){let b=bids[p]!=null?bids[p]:'-';let w=tricksWon[p]!=null?tricksWon[p]:0;tag.innerHTML=p+'<br><b>'+b+'/'+w+'</b>';}let av=document.getElementById('av-'+id);if(av){av.innerText=p[0];if(i==turn)av.classList.add('active');else av.classList.remove('active');}}for(let i=0;i<players.length;i++){let p=players[i];let pe=document.getElementById('p'+i);let se=document.getElementById('sc'+i);let be=document.getElementById('bg'+i);if(pe)pe.innerText=p||["A","B","C","D"][i];if(se)se.innerText=scores[p]||0;if(be)be.innerText=extra[p]||0;}}
function getValidCards(hand){if(center.length==0){let arr=[];for(let i=0;i<hand.length;i++)arr.push(i);return arr;}let lead=center[0].s;let has=false;for(let i=0;i<hand.length;i++) if(hand[i].s==lead) has=true;if(has){let arr=[];for(let i=0;i<hand.length;i++) if(hand[i].s==lead) arr.push(i); return arr;}let arr2=[];for(let i=0;i<hand.length;i++)arr2.push(i);return arr2;}
function getThrowClass(who){let idx=0;for(let i=0;i<players.length;i++) if(players[i]==who) idx=i; if(idx==0)return 'throw-bottom';if(idx==1)return 'throw-left';if(idx==2)return 'throw-top';return 'throw-right';}
function getWinClass(who){let idx=0;for(let i=0;i<players.length;i++) if(players[i]==who) idx=i; if(idx==0)return 'win-to-A';if(idx==1)return 'win-to-B';if(idx==2)return 'win-to-C';return 'win-to-D';}
function renderAll(){
  for(let pi=0;pi<players.length;pi++){
    let p=players[pi]; let id=["A","B","C","D"][pi]; let cont=document.getElementById('hand-'+id); if(!cont)continue;
    let h=[]; let hh=hands[p]||[]; for(let i=0;i<hh.length;i++) h.push(hh[i]); h.sort(sortBySuit);
    if(p==myName||(isBotGame&&pi==0)){
      let html=''; for(let idx=0;idx<h.length;idx++){let c=h[idx]; let isValid=true; if(center.length>0){let lead=center[0].s; let has=false; for(let k=0;k<h.length;k++) if(h[k].s==lead) has=true; if(has) isValid=c.s==lead;} html+='<div class="card '+(c.s=='♥'||c.s=='♦'?'red':'black')+(isValid?'':' disabled')+'" onclick="playCardSorted('+idx+')"><div class="rank">'+c.r+'</div><div class="suit">'+c.s+'</div><div class="rank" style="font-size:8px">'+c.r+'</div></div>';}
      cont.innerHTML=html;
    }else{
      let html=''; for(let i=0;i<h.length;i++) html+='<div class="card back"></div>'; cont.innerHTML=html;
    }
  }
  let cc=document.getElementById('centerCards');
  if(cc){
    let html=''; for(let i=0;i<center.length;i++){let c=center[i]; let idx=0; for(let k=0;k<players.length;k++) if(players[k]==c.who) idx=k; let posClass=idx==0?'pos-A':idx==1?'pos-B':idx==2?'pos-C':'pos-D'; let throwCls=getThrowClass(c.who); html+='<div class="card '+(c.s=='♥'||c.s=='♦'?'red':'black')+' '+posClass+' '+throwCls+'"><div class="rank">'+c.r+'</div><div class="suit" style="font-size:26px">'+c.s+'</div><div class="whoLabel">'+c.who+'</div></div>';}
    cc.innerHTML=html;
  }
}
function playCardSorted(sortedIdx){
  let hand=hands[myName]||[];
  let sortedHand=[]; for(let i=0;i<hand.length;i++) sortedHand.push(hand[i]); sortedHand.sort(sortBySuit);
  let cardToPlay=sortedHand[sortedIdx];
  if(!cardToPlay) return;
  if(center.length>0){
    let lead=center[0].s;
    let has=false; for(let i=0;i<hand.length;i++) if(hand[i].s==lead) has=true;
    if(has && cardToPlay.s!=lead){alert('Rule: Aapke paas '+lead+' hai, toh '+lead+' hi dalna padega!'); return;}
  }
  let realIdx=-1; for(let i=0;i<hand.length;i++){ if(hand[i].id===cardToPlay.id){ realIdx=i; break; } }
  if(realIdx>=0){ hand.splice(realIdx,1); } else { return; }
  center.push({s:cardToPlay.s,r:cardToPlay.r,p:cardToPlay.p,id:cardToPlay.id,who:myName});
  if(isHost){nextTurnHost();}else{let conn=Object.values(conns)[0];if(conn)conn.send({type:'play',center:center});}
  renderAll();
}
function playCard(i){playCardSorted(i);}
function botPlay(){let who=players[turn];let h=hands[who];let validIdx=getValidCards(h);if(validIdx.length===0) return;let chosenIdx=validIdx[rnd(validIdx.length)];let card=h[chosenIdx];if(!card) return;let idx=-1; for(let i=0;i<h.length;i++){ if(h[i].id===card.id){ idx=i; break; } } if(idx>=0) h.splice(idx,1); else return;center.push({s:card.s,r:card.r,p:card.p,id:card.id,who:who});nextTurnHost();}
function nextTurnHost(){renderAll();updateUI();if(center.length<4){turn=(turn+1)%players.length;broadcast({type:'play',center:center,turn:turn,tricksWon:tricksWon});if(isBotGame&&players[turn]!=myName)setTimeout(botPlay,900);}else{setTimeout(endTrickHost,1200);}}
function endTrickHost(){let lead=center[0].s;let win=center[0];for(let i=1;i<center.length;i++){let c=center[i];if(c.s==trump&&win.s!=trump)win=c;else if(c.s==trump&&win.s==trump&&c.p>win.p)win=c;else if(c.s==lead&&win.s==lead&&win.s!=trump&&c.p>win.p)win=c;}tricksWon[win.who]=(tricksWon[win.who]||0)+1;let winCls=getWinClass(win.who);let cc=document.getElementById('centerCards');if(cc){let els=cc.querySelectorAll('.card'); for(let i=0;i<els.length;i++) els[i].classList.add(winCls);}setTimeout(function(){center=[];let winIdx=0; for(let i=0;i<players.length;i++) if(players[i]==win.who) winIdx=i; turn=winIdx; trick++;broadcast({type:'trickEnd',tricksWon:tricksWon,turn:turn,trick:trick,center:center});updateUI();renderAll();if(trick>13){setTimeout(endGameHost,600);}else{if(isBotGame&&players[turn]!=myName)setTimeout(botPlay,900);}},700);}
function endGameHost(){let roundEntries=[];for(let i=0;i<players.length;i++){let p=players[i];let bid=bids[p];let won=tricksWon[p];let delta=0;if(won>=bid){delta=bid*10+(won-bid);scores[p]+=delta;extra[p]+=(won-bid);}else{delta=-bid*10;scores[p]+=delta;}roundEntries.push({round:gameNo,player:p,bid:bid,won:won,delta:delta,total:scores[p],bag:extra[p]});if(extra[p]>=10){scores[p]-=100;extra[p]-=10;}}historyLog=historyLog.concat(roundEntries);let nextGame=gameNo+1;broadcast({type:'gameOver',scores:scores,extra:extra,nextGame:nextGame,historyLog:historyLog});if(nextGame>15){showFinal();}else{gameNo=nextGame;showHistoryAuto();}}
function showHistory(){renderHistory();document.getElementById('historyModal').classList.remove('hidden');}
function closeHistory(){document.getElementById('historyModal').classList.add('hidden');}
function showHistoryAuto(){renderHistory();document.getElementById('historyModal').classList.remove('hidden');}
function nextRoundStart(){if(isHost){broadcast({type:'nextRound',gameNo:gameNo});closeHistory();hostStartGame();}else{let conn=Object.values(conns)[0];if(conn)conn.send({type:'nextRound',gameNo:gameNo});alert('Host ko Next Round dabane bolo');}}
function renderHistory(){let html='<table class="histTable"><tr><th>Rnd</th><th>Player</th><th>Bid</th><th>Bane</th><th>+/-</th><th>Total</th><th>Bagh</th></tr>';let sorted=[]; for(let i=0;i<historyLog.length;i++) sorted.push(historyLog[i]); sorted.sort(function(a,b){return a.round-b.round;});for(let i=0;i<sorted.length;i++){let e=sorted[i]; html+='<tr><td>'+e.round+'</td><td>'+e.player+'</td><td>'+e.bid+'</td><td>'+e.won+'</td><td style="color:'+(e.delta>=0?'#0f0':'#f55')+'">'+e.delta+'</td><td>'+e.total+'</td><td>'+e.bag+'</td></tr>';}if(historyLog.length===0)html+='<tr><td colspan="7">Abhi koi round nahi hua</td></tr>';html+='</table>';document.getElementById('historyContent').innerHTML=html;}
function showFinal(){document.getElementById('modal').classList.remove('hidden');let win=players[0]; let max=scores[win]||0; for(let i=1;i<players.length;i++){if((scores[players[i]]||0)>max){max=scores[players[i]]; win=players[i];}}let div=''; for(let i=0;i<players.length;i++){let p=players[i]; div+='<div class="bidbox">'+p+': '+scores[p]+' pts Bag '+extra[p]+'</div>';}document.getElementById('modal').innerHTML='<div class="modalBox"><h3>🏆 Final 15 Games - Winner</h3><div>'+div+'</div><button class="btn bg" onclick="showHistory()">History Dekho</button><div style="margin-top:8px;color:#ffca28">Winner: '+win+'</div><button class="btn by" onclick="location.reload()">Naya 15 Games</button></div>';}
function copyRoom(){try{navigator.clipboard.writeText(roomId);alert('Room ID: '+roomId);}catch(e){alert(roomId);}}
function shareWA(){let url=location.href;let txt='Trump Premium khelo! Room ID: '+roomId+' Link: '+url;window.open('https://wa.me/?text='+encodeURIComponent(txt));}
</script>
